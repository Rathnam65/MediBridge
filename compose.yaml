services:
  app:
    build:
      context: .
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /data/medibridge.db
      CLINICAL_DATA_APPROVED: ${CLINICAL_DATA_APPROVED:-false}
      SYNTHETIC_DEMO_ENABLED: ${SYNTHETIC_DEMO_ENABLED:-false}
      RELEASE_APPROVALS_PATH: /app/release-approvals.json
      ALLOWED_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
    volumes:
      - medibridge-data:/data
      - ./${RELEASE_APPROVALS_FILE:-release-approvals.example.json}:/app/release-approvals.json:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    expose:
      - "8000"
    networks:
      - internal

  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  medibridge-data:
  caddy-data:
  caddy-config:

networks:
  internal:
